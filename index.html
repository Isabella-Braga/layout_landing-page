<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Landing Page</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__top">
          <a
            href="#"
            class="header__logo"
          >
            THE <br>
            MET
          </a>

          <div class="header__actions">
            <a
              href="tel:+12125357710"
              class="header__icon"
            >
              <img
                src="src/images/Icon-Phone-call.svg"
                alt="Phone icon"
                class="header__icon-image"
              >
            </a>

            <a
              href="#menu"
              class="header__icon"
            >
              <img
                src="src/images/menu.svg"
                alt="Menu icon"
                class="header__icon-image"
              >
            </a>
          </div>
        </div>

        <h1 class="header__title">
          WELCOME <br>
          TO THE MET
        </h1>
      </div>
    </header>

    <main class="main">
      <section class="hours">
        <div class="container"></div>
      </section>

      <section class="now-on-view">
        <div class="container"></div>
      </section>

      <section class="explore">
        <div class="container"></div>
      </section>

      <section class="contacts">
        <div class="container"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="container"></div>
    </footer>
  </body>
</html>
